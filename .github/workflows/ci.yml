name: Server CI and image

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: python -m ruff format --check app tests main.py

      - name: Lint
        run: python -m ruff check app tests main.py

      - name: Typecheck
        run: python -m mypy app

      - name: Test
        run: python -m pytest -q

      - name: Validate linux/amd64 image build
        run: |
          docker build \
            --platform linux/amd64 \
            --file dockerfile \
            --tag watch-up-server:ci .

      - name: Validate non-root runtime and Docker health
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' watch-up-server:ci)" = appuser

          docker run -d \
            --name watch-up-server-ci \
            --publish 127.0.0.1:18000:8000 \
            --health-interval 2s \
            --health-timeout 2s \
            --health-start-period 1s \
            --health-retries 10 \
            --env APP_ENV=test \
            --env REDIS_URL=redis://127.0.0.1:9/0 \
            --env UPBIT_BASE_URL=http://127.0.0.1:9 \
            --env UPBIT_TIMEOUT_SECONDS=0.1 \
            --env UPBIT_MAX_RETRIES=0 \
            --env CORS_ALLOWED_ORIGINS=http://localhost:8080 \
            watch-up-server:ci

          cleanup() { docker rm -f watch-up-server-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          health=starting
          for _ in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' watch-up-server-ci)"
            [[ "$health" == healthy ]] && break
            [[ "$health" == unhealthy ]] && break
            sleep 2
          done
          if [[ "$health" != healthy ]]; then
            docker logs watch-up-server-ci
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18000/api/health | grep -q '"status"'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
